monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - api          # API request/response logging
        - admin        # Admin interface logging
        - security     # Authentication and authorization logging
        - database     # Database operations logging

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]

            api:
                type: stream
                path: "%kernel.logs_dir%/api.log"
                level: info
                channels: [api]

            admin:
                type: stream
                path: "%kernel.logs_dir%/admin.log"
                level: info
                channels: [admin]

            security:
                type: stream
                path: "%kernel.logs_dir%/security.log"
                level: info
                channels: [security]

            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!api"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json

            api:
                type: stream
                path: php://stderr
                level: warning
                channels: [api]
                formatter: monolog.formatter.json

            security:
                type: stream
                path: php://stderr
                level: warning
                channels: [security]
                formatter: monolog.formatter.json

            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
